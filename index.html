<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="login">
      <h1>LINE</h1>
      <p id="status">Opening a login QR…</p>
      <section id="qr-card" hidden>
        <canvas id="qr" width="320" height="320" aria-label="LINE login QR code"></canvas>
      </section>
      <p id="pin" hidden></p>
      <button id="refresh" type="button">Refresh QR</button>
    </main>
    <div id="app" hidden>
      <nav id="rail" aria-label="LINE">
        <img id="rail-photo" alt="" hidden />
        <span id="rail-initial" aria-hidden="true"></span>
        <button id="rail-chats" type="button" aria-label="Chats" class="on">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M5 6.5A3.5 3.5 0 0 1 8.5 3h7A3.5 3.5 0 0 1 19 6.5v6a3.5 3.5 0 0 1-3.5 3.5H11l-3.6 2.4A1 1 0 0 1 6 17.6V16H8.5A3.5 3.5 0 0 1 5 12.5v-6z"
            />
          </svg>
          <span id="rail-count" hidden></span>
        </button>
        <button id="rail-friends" type="button" aria-label="Friends">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10" cy="8" r="3" />
            <path d="M4.5 18.5c.6-2.6 2.8-4 5.5-4s4.9 1.4 5.5 4" />
            <path d="M17 8v6M14 11h6" />
          </svg>
        </button>
        <button id="rail-more" type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="6" cy="12" r="1.5" />
            <circle cx="12" cy="12" r="1.5" />
            <circle cx="18" cy="12" r="1.5" />
          </svg>
        </button>
        <div id="rail-menu" role="menu" hidden>
          <button type="button" data-action="settings" role="menuitem">Settings</button>
          <button type="button" data-action="help" role="menuitem">Help</button>
          <button type="button" data-action="about" role="menuitem">About LINE</button>
          <hr />
          <button type="button" data-action="logout" role="menuitem">Log out</button>
          <button type="button" data-action="quit" role="menuitem">Quit</button>
        </div>
      </nav>
      <section id="list-pane">
        <div id="tabs" role="tablist">
          <button type="button" data-filter="all" class="on">All</button>
          <button type="button" data-filter="friend">Friends</button>
          <button type="button" data-filter="group">Groups</button>
          <button type="button" data-filter="official">Official accounts</button>
        </div>
        <label id="search-wrap">
          <span aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search chat list" />
        </label>
        <ul id="chats"></ul>
        <p id="chat-failures" hidden></p>
      </section>
      <section id="thread" hidden>
        <header id="thread-head"></header>
        <div id="thread-body"></div>
        <form id="composer">
          <p id="send-error" class="send-error" hidden></p>
          <div id="reply-bar" hidden>
            <span id="reply-avatar" aria-hidden="true"></span>
            <div>
              <strong id="reply-label"></strong>
              <span id="reply-text"></span>
            </div>
            <button id="reply-cancel" type="button" aria-label="Cancel reply">×</button>
          </div>
          <input id="composer-input" type="text" placeholder="Enter a message" disabled />
        </form>
      </section>
    </div>
    <div id="lightbox" hidden>
      <button id="lightbox-prev" type="button" aria-label="Previous">‹</button>
      <img id="lightbox-img" alt="" />
      <video id="lightbox-video" hidden autoplay loop muted playsinline></video>
      <button id="lightbox-next" type="button" aria-label="Next">›</button>
      <button id="lightbox-close" type="button" aria-label="Close">×</button>
    </div>
    <div id="sheet" hidden>
      <div id="sheet-card">
        <h2 id="sheet-title"></h2>
        <p id="sheet-body"></p>
        <div id="sheet-list" hidden></div>
        <div id="sheet-about" hidden>
          <dl>
            <div>
              <dt>Build</dt>
              <dd id="about-build"></dd>
            </div>
            <div>
              <dt>Built</dt>
              <dd id="about-time"></dd>
            </div>
          </dl>
        </div>
        <form id="sheet-settings" hidden>
          <label class="setting">
            <input id="minimize-to-tray" type="checkbox" checked />
            <span>
              Keep running in the tray
              <small>Closing the window leaves LINE in the tray. Right-click that icon to open it again, or use Quit to exit.</small>
            </span>
          </label>
        </form>
        <button id="sheet-close" type="button">Close</button>
      </div>
    </div>
    <div id="msg-menu" role="menu" hidden>
      <button type="button" data-action="reply" role="menuitem">Reply</button>
      <button type="button" data-action="copy" role="menuitem">Copy</button>
      <button type="button" data-action="share" role="menuitem">Share</button>
      <hr data-for="report" hidden />
      <button type="button" data-action="report" data-for="report" role="menuitem" hidden>Report</button>
      <button type="button" data-action="unsend" data-for="mine" role="menuitem">Unsend</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
