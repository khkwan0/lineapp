<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="profile">
    <div id="cover">
      <img id="cover-img" alt="" hidden />
      <div id="avatar"></div>
    </div>
    <div id="profile-body">
      <div id="name-row">
        <h1 id="profile-name"></h1>
        <button id="rename" type="button" data-i18n-aria="editName" aria-label="Edit name" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M13.8 4.8 19.2 10.2 8.4 21H3v-5.4L13.8 4.8z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <input id="name-input" type="text" maxlength="20" hidden />
        <button id="favorite" type="button" data-i18n-aria="favorite" aria-label="Favorite" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3.4 14.7 9l6.1.6-4.6 4 1.4 5.9L12 16.7 6.4 19.5 7.8 13.6 3.2 9.6 9.3 9 12 3.4z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>
      <p id="profile-status" hidden></p>
      <button id="report" type="button" data-i18n="report">Report</button>
      <div id="fraud">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#e23b2f" d="M12 2.8 1.8 21.2h20.4L12 2.8z" />
          <path fill="#fff" d="M11.1 9.1h1.8l-.25 5.6h-1.3L11.1 9.1zm.9 7.15a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1z" />
        </svg>
        <div>
          <p data-i18n="fraudWatch">Watch out for fraud using LINE.</p>
          <button id="learn" type="button" data-i18n="learnMore">Learn more</button>
        </div>
      </div>
      <p id="note" hidden></p>
    </div>
    <div id="confirm" hidden>
      <p id="confirm-text"></p>
      <div>
        <button id="confirm-no" type="button" data-i18n="cancel">Cancel</button>
        <button id="confirm-yes" type="button" data-i18n="block">Block</button>
      </div>
    </div>
    <footer id="profile-actions">
      <button id="block" type="button" data-i18n-aria="block" aria-label="Block">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M7.1 16.9 16.9 7.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </button>
      <button id="chat" type="button" data-i18n-aria="chat" aria-label="Chat" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M5 6.2h14a2.2 2.2 0 0 1 2.2 2.2v6.2A2.2 2.2 0 0 1 19 16.8h-6.2L8.2 19.6v-2.8H5A2.2 2.2 0 0 1 2.8 14.6V8.4A2.2 2.2 0 0 1 5 6.2z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
          <circle cx="8.5" cy="11.6" r="1" fill="currentColor" />
          <circle cx="12" cy="11.6" r="1" fill="currentColor" />
          <circle cx="15.5" cy="11.6" r="1" fill="currentColor" />
        </svg>
      </button>
      <button id="add" type="button" data-i18n-aria="addFriend" aria-label="Add friend">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="9.5" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path
            d="M3.8 18.6c.7-2.8 2.8-4.2 5.7-4.2 1.1 0 2.1.2 3 .6"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
          <path d="M17.2 11.2v5.6M14.4 14h5.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </button>
    </footer>
    <script type="module" src="/src/profile.ts"></script>
  </body>
</html>
